# Projet Xcode généré par XcodeGen (sur les Mac de GitHub) : on ne versionne que cette description.
name: MaRoutine
options:
  bundleIdPrefix: com.pixeldesigner
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: fr
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: "NO"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  MaRoutine:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Ma routine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        NSHealthShareUsageDescription: "Ma routine lit ton nombre de pas pour suivre ton objectif de marche."
        NSHealthUpdateUsageDescription: "Ma routine peut enregistrer tes séances de muscu dans Santé."
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/MaRoutine.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups: [group.com.pixeldesigner.maroutine]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixeldesigner.maroutine
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: MaRoutineWidgets
        embed: true
    scheme: {}
  MaRoutineWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Ma routine
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/MaRoutineWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.pixeldesigner.maroutine]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pixeldesigner.maroutine.widgets
        SKIP_INSTALL: "YES"
